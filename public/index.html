<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple EMA Potential Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.5.1/dist/vuetify.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
    <style>
        [v-cloak] {
            display: none;
        }

        .stock-symbol {
            font-weight: 600;
            font-size: 1.05em;
            font-family: 'Courier New', monospace;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .stock-symbol:hover {
            color: #1976D2;
        }

        .vn30-icon {
            color: #4CAF50;
            font-size: 1em;
        }

        .vn100-icon {
            color: #2196F3;
            font-size: 1em;
        }

        .hnx30-icon {
            color: #FF9800;
            font-size: 1em;
        }

        .price-cell {
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            text-align: center;
        }

        .change-positive {
            color: #4CAF50;
            font-weight: 600;
        }

        .change-negative {
            color: #F44336;
            font-weight: 600;
        }

        .change-neutral {
            color: #FFA726;
            font-weight: 600;
        }

    </style>
</head>

<body>
    <div id="app" v-cloak>
        <v-app>
            <v-app-bar color="primary" density="compact">
                <v-app-bar-title>
                    <v-icon icon="mdi-chart-line" class="mr-2"></v-icon>
                    Triple EMA Potential Monitor
                </v-app-bar-title>
                <v-spacer></v-spacer>
                <!-- Analysis Progress -->
                <div v-if="autoAnalyzing" class="mr-4" style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 0.9em;">
                        Phân tích: {{ analyzingProgress.completed }}/{{ analyzingProgress.total }}
                    </span>
                </div>
                <v-btn icon="mdi-chart-box-outline" @click="autoAnalyzeAll" :loading="autoAnalyzing" variant="text"
                    title="Phân tích tất cả"></v-btn>
                <v-btn icon="mdi-refresh" @click="loadData" :loading="loading" variant="text" title="Reload"></v-btn>
            </v-app-bar>

            <v-main>
                <v-container fluid>
                    <!-- Matrix Table -->
                    <v-card>
                        <!-- Exchange Filter Tabs -->
                        <v-tabs v-model="selectedExchange" density="compact" class="px-4">
                            <v-tab value="POTENTIAL">POTENTIAL</v-tab>
                            <v-tab value="WATCHLIST">Watch List</v-tab>
                            <v-tab value="VN30">VN30</v-tab>
                            <v-tab value="HNX30">HNX30</v-tab>
                            <v-tab value="VN100">VN100</v-tab>
                        </v-tabs>

                        <v-data-table :headers="matrixHeaders" :items="sortedSymbols" :items-per-page="100"
                            v-model:sort-by="sortBy" :must-sort="false" :multi-sort="false" class="elevation-1"
                            density="compact" :search="search" :no-data-text="tableNoDataText">
                            <template v-slot:top>
                                <v-text-field v-model="search" label="Tìm kiếm mã" prepend-inner-icon="mdi-magnify"
                                    variant="outlined" hide-details single-line class="ma-4"
                                    density="compact"></v-text-field>
                            </template>

                            <!-- Custom Header for Price Column with Stats -->
                            <template v-slot:header.price>
                                <div style="text-align: center; line-height: 1.2;">
                                    <div v-if="priceStats.total > 0">
                                        <span style="font-weight: 600; color: #4CAF50;">{{
                                            priceStats.up }}▲</span>
                                        <span style="font-weight: 600; color: #FFA726;">{{
                                            priceStats.neutral }}−</span>
                                        <span style="font-weight: 600; color: #F44336;">{{
                                            priceStats.down }}▼</span>
                                    </div>
                                    <div style="color: #666;">({{ priceStats.total }} mã)</div>
                                </div>
                            </template>

                            <!-- Symbol Column with Analyze Button -->
                            <template v-slot:item.symbol="{ item }">
                                <a :href="item.tradingViewUrl" target="_blank" class="stock-symbol"
                                    style="text-decoration: none; color: inherit; display: flex;">
                                    {{ item.symbol }}
                                    <v-chip v-if="item.exchange" size="x-small"
                                        :color="item.exchange === 'HOSE' ? 'blue' : 'orange'" variant="flat"
                                        style="margin-left: 4px; font-size: 0.7em; height: 16px;">
                                        {{ item.exchange }}
                                    </v-chip>
                                    <v-icon v-if="item.isVN30" icon="mdi-star" class="vn30-icon" title="VN30"></v-icon>
                                    <v-icon v-if="item.isHNX30" icon="mdi-star-half-full" class="hnx30-icon" title="HNX30"></v-icon>
                                    <v-icon v-if="item.isVN100" icon="mdi-star-outline" class="vn100-icon"
                                        title="VN100"></v-icon>
                                </a>
                            </template>

                            <template v-slot:item.potential="{ item }">
                                <div v-if="item.potentialSignal" style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
                                <v-tooltip location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" color="amber-darken-2" variant="tonal"
                                            size="small" class="font-weight-bold">
                                            {{ item.potentialSignal.badge }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.potentialSignal.tooltip"></div>
                                </v-tooltip>
                                </div>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Price Change Column -->
                            <template v-slot:item.price="{ item }">
                                <div class="price-cell" :class="getChangeClass(item.analysis?.price?.changePercent)">
                                    {{ formatPriceChange(item.analysis?.price?.current,
                                    item.analysis?.price?.changePercent) }}
                                </div>
                            </template>

                            <!-- Volume Column -->
                            <template v-slot:item.volume="{ item }">
                                <v-tooltip v-if="item.analysis?.volume_analysis" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="item.analysis.volume_analysis.color"
                                            :prepend-icon="item.analysis.volume_analysis.icon" size="small"
                                            class="text-white font-weight-bold">
                                            {{ item.analysis.volume_analysis.label }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.analysis.volume_analysis.tooltip"></div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Price vs MA Column -->
                            <template v-slot:item.price_vs_ma="{ item }">
                                <v-tooltip v-if="item.analysis?.price_position" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="item.analysis.price_position.color"
                                            :prepend-icon="item.analysis.price_position.icon" size="small"
                                            class="text-white font-weight-bold">
                                            {{ item.analysis.price_position.label }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.analysis.price_position.tooltip"></div>
                                    <div style="margin-top: 6px; opacity: 0.85;">
                                        Nguồn: {{ item.analysis.data_source || 'không xác định' }} ·
                                        Phiên: {{ item.analysis.data_as_of || 'không xác định' }}<br>
                                        Ba đường EMA(close) 10/20/50 · seed SMA · giá lịch sử chưa điều chỉnh<br>
                                        Hoàn nguyên {{ item.analysis.cash_dividend_adjustments?.length || 0 }} sự kiện cổ tức tiền mặt ·
                                        {{ item.analysis.data_price_mode === 'UNADJUSTED_RESTORED' ? 'đã xác minh corporate actions' : 'chưa xác minh corporate actions' }}
                                    </div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Convergence Column -->
                            <template v-slot:item.convergence="{ item }">
                                <v-tooltip v-if="item.analysis?.convergence" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="item.analysis.convergence.color"
                                            :prepend-icon="item.analysis.convergence.icon" size="small"
                                            class="text-white font-weight-bold">
                                            {{ item.analysis.convergence.label }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.analysis.convergence.tooltip"></div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Order & Crosses Column - 3 icons independent -->
                            <template v-slot:item.order_crosses="{ item }">
                                <div v-if="item.analysis" style="display: flex; gap: 4px; justify-content: center;">
                                    <!-- Perfect Order Icon -->
                                    <v-tooltip location="top">
                                        <template v-slot:activator="{ props }">
                                            <v-icon v-bind="props"
                                                :icon="item.analysis.perfect_order ? 'mdi-check-circle' : 'mdi-close-circle'"
                                                :color="item.analysis.perfect_order ? 'success' : 'grey'" size="small"
                                                :style="{opacity: item.analysis.perfect_order ? 1 : 0.3}">
                                            </v-icon>
                                        </template>
                                        <div v-if="item.analysis.perfect_order">✅ Perfect Order: MA10 > MA20 > MA50
                                        </div>
                                        <div v-else>❌ No Perfect Order</div>
                                    </v-tooltip>

                                    <!-- Golden Cross Icon -->
                                    <v-tooltip location="top">
                                        <template v-slot:activator="{ props }">
                                            <v-icon v-bind="props"
                                                :icon="item.analysis.golden_cross?.icon || 'mdi-star-circle'"
                                                :color="item.analysis.golden_cross?.color || 'grey'" size="small"
                                                :style="{opacity: item.analysis.golden_cross?.has_recent_cross || item.analysis.golden_cross?.has_cross ? 1 : 0.3}">
                                            </v-icon>
                                        </template>
                                        <div v-html="item.analysis.golden_cross?.tooltip || 'No Golden Cross'"></div>
                                    </v-tooltip>

                                    <!-- Death Cross Icon -->
                                    <v-tooltip location="top">
                                        <template v-slot:activator="{ props }">
                                            <v-icon v-bind="props" icon="mdi-close-circle"
                                                :color="item.analysis.death_cross?.has_cross ? 'error' : 'grey'"
                                                size="small"
                                                :style="{opacity: item.analysis.death_cross?.has_cross ? 1 : 0.3}">
                                            </v-icon>
                                        </template>
                                        <div v-html="item.analysis.death_cross?.tooltip || 'No Death Cross'"></div>
                                    </v-tooltip>
                                </div>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Expansion Column -->
                            <template v-slot:item.expansion="{ item }">
                                <v-tooltip v-if="item.analysis?.expansion" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="item.analysis.expansion.color"
                                            :prepend-icon="item.analysis.expansion.icon" size="small"
                                            class="text-white font-weight-bold">
                                            {{ item.analysis.expansion.label }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.analysis.expansion.tooltip"></div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Momentum Column -->
                            <template v-slot:item.momentum="{ item }">
                                <v-tooltip v-if="item.analysis?.momentum" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="item.analysis.momentum.color"
                                            :prepend-icon="item.analysis.momentum.icon" size="small"
                                            class="text-white font-weight-bold">
                                            {{ item.analysis.momentum.label }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.analysis.momentum.tooltip"></div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>
                        </v-data-table>
                    </v-card>

                    <v-overlay :model-value="loading" class="align-center justify-center">
                        <v-progress-circular indeterminate size="64" color="primary"></v-progress-circular>
                    </v-overlay>

                    <v-snackbar v-model="errorSnackbar" color="error" timeout="5000">
                        {{ errorMessage }}
                        <template v-slot:actions>
                            <v-btn variant="text" @click="errorSnackbar = false">Đóng</v-btn>
                        </template>
                    </v-snackbar>
                </v-container>
            </v-main>
        </v-app>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.15/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.5.1/dist/vuetify.min.js"></script>
    <script src="/potential-ranker.js"></script>
    <script>
        const { createApp } = Vue;
        const { createVuetify } = Vuetify;

        const vuetify = createVuetify({
            theme: {
                defaultTheme: 'light',
                themes: {
                    light: {
                        colors: {
                            primary: '#1976D2',
                            secondary: '#424242',
                            accent: '#82B1FF',
                            error: '#FF5252',
                            info: '#2196F3',
                            success: '#4CAF50',
                            warning: '#FFC107',
                        },
                    },
                },
            },
        });

        const app = createApp({
            data() {
                return {
                    loading: false,
                    selectedExchange: 'POTENTIAL',
                    matrixData: {
                        symbols: []
                    },
                    search: '',
                    errorSnackbar: false,
                    errorMessage: '',
                    analyzingProgress: { completed: 0, total: 0 },
                    autoAnalyzing: false,
                    analysisRunId: 0,
                    // Table sorting state
                    sortBy: [] // Vuetify v-model:sort-by binding
                };
            },
            computed: {
                displayedSymbols() {
                    // Potential is an observation table, not a filter. Every
                    // symbol stays visible, including zero-star rows.
                    return this.matrixData?.symbols || [];
                },
                tableNoDataText() {
                    if (this.selectedExchange !== 'POTENTIAL') {
                        return 'No data available';
                    }
                    if (this.autoAnalyzing) {
                        return `Đang phân tích ${this.analyzingProgress.completed}/${this.analyzingProgress.total} mã.`;
                    }
                    const total = this.matrixData?.symbols?.length || 0;
                    const analyzed = (this.matrixData?.symbols || []).filter(symbol => !!symbol.analysis).length;
                    if (analyzed < total) {
                        return `Mới phân tích ${analyzed}/${total} mã. Hãy bấm nút Phân tích tất cả để tiếp tục.`;
                    }
                    return 'Không có mã trong danh sách theo dõi.';
                },
                // Sorted symbols
                sortedSymbols() {
                    if (!this.displayedSymbols) {
                        return [];
                    }

                    const symbols = [...this.displayedSymbols];

                    // Default sort
                    if (!this.sortBy || this.sortBy.length === 0) {
                        return this.applySortByPotential(symbols);
                    }

                    // Use custom sorting based on clicked column
                    const sortConfig = this.sortBy[0]; // Vuetify returns array [{key, order}]
                    return this.applySortByColumn(symbols, sortConfig.key, sortConfig.order);
                },
                priceStats() {
                    if (!this.displayedSymbols) {
                        return { up: 0, down: 0, neutral: 0, total: 0 };
                    }

                    let up = 0, down = 0, neutral = 0;

                    this.displayedSymbols.forEach(symbol => {
                        const change = symbol.analysis?.price?.changePercent;
                        if (change !== null && change !== undefined) {
                            if (change > 0) {
                                up++;
                            } else if (change < 0) {
                                down++;
                            } else {
                                neutral++;
                            }
                        } else {
                            neutral++;
                        }
                    });

                    return {
                        up,
                        down,
                        neutral,
                        total: up + down + neutral
                    };
                },
                matrixHeaders() {
                    const headers = [
                        {
                            title: 'Symbol',
                            key: 'symbol',
                            align: 'start',
                            sortable: true,
                            width: '100px'
                        },
                        {
                            title: 'Price',
                            key: 'price',
                            align: 'end',
                            sortable: true,
                            width: '100px'
                        },
                        {
                            title: 'Potential',
                            key: 'potential',
                            align: 'center',
                            sortable: true,
                            width: '140px'
                        },
                        {
                            title: 'Volume',
                            key: 'volume',
                            align: 'center',
                            sortable: true,
                            width: '120px'
                        },
                        {
                            title: 'Price vs MA',
                            key: 'price_vs_ma',
                            align: 'center',
                            sortable: true,
                            width: '120px'
                        },
                        {
                            title: 'Convergence',
                            key: 'convergence',
                            align: 'center',
                            sortable: true,
                            width: '150px'
                        },
                        {
                            title: 'Order & Crosses',
                            key: 'order_crosses',
                            align: 'center',
                            sortable: true,
                            width: '130px'
                        },
                        {
                            title: 'Expansion',
                            key: 'expansion',
                            align: 'center',
                            sortable: true,
                            width: '120px'
                        },
                        {
                            title: 'Momentum',
                            key: 'momentum',
                            align: 'center',
                            sortable: true,
                            width: '140px'
                        },
                    ];

                    return headers;
                }
            },
            mounted() {
                this.loadData().then(loaded => {
                    if (loaded) this.autoAnalyzeAll();
                });
            },
            watch: {
                selectedExchange() {
                    // Cancel the previous tab's detached batch immediately. A
                    // fresh run starts after the new symbol list is loaded.
                    this.analysisRunId += 1;
                    this.autoAnalyzing = false;
                    this.loadData().then(loaded => {
                        if (loaded) this.autoAnalyzeAll();
                    });
                }
            },
            methods: {
                applySortByPotential(symbols) {
                    return symbols.sort(PotentialRanker.comparePotentialRows);
                },

                /**
                 * Apply column-specific sorting (when user clicks column header)
                 */
                applySortByColumn(symbols, columnKey, order = 'asc') {
                    const comparator = this.getComparatorForColumn(columnKey);
                    const sortedSymbols = symbols.sort(comparator);
                    return order === 'desc' ? sortedSymbols.reverse() : sortedSymbols;
                },

                /**
                 * Get appropriate comparator function for each column type
                 */
                getComparatorForColumn(columnKey) {
                    const comparators = {
                        // Symbol: alphabetical
                        symbol: (a, b) => (a.symbol || '').localeCompare(b.symbol || ''),

                        // Price: by current price value
                        price: (a, b) => {
                            const aPrice = a.analysis?.price?.current ?? -Infinity;
                            const bPrice = b.analysis?.price?.current ?? -Infinity;
                            return aPrice - bPrice;
                        },

                        // Volume: by volume ratio
                        volume: (a, b) => {
                            const aVolume = a.analysis?.volume_analysis?.volume_ratio ?? -Infinity;
                            const bVolume = b.analysis?.volume_analysis?.volume_ratio ?? -Infinity;
                            return aVolume - bVolume;
                        },

                        potential: (a, b) => {
                            return (a.potentialSignal?.stars ?? -1) - (b.potentialSignal?.stars ?? -1);
                        },

                        // Price vs MA: by distance to MA50
                        price_vs_ma: (a, b) => {
                            const aDist = a.analysis?.price_position?.vs_ma50 ?? -Infinity;
                            const bDist = b.analysis?.price_position?.vs_ma50 ?? -Infinity;
                            return aDist - bDist;
                        },

                        // Convergence: by convergence percentage
                        convergence: (a, b) => {
                            const aConv = a.analysis?.convergence?.convergence_pct ?? Infinity;
                            const bConv = b.analysis?.convergence?.convergence_pct ?? Infinity;
                            return aConv - bConv;
                        },

                        // Order & Crosses: explicit factual ordering, no score.
                        order_crosses: (a, b) => {
                            const fields = [
                                item => !item.analysis?.death_cross?.has_cross,
                                item => !!item.analysis?.perfect_order,
                                item => !!(item.analysis?.golden_cross?.has_recent_cross || item.analysis?.golden_cross?.has_cross)
                            ];
                            for (const field of fields) {
                                const difference = Number(field(a)) - Number(field(b));
                                if (difference !== 0) return difference;
                            }
                            return 0;
                        },

                        // Expansion: by quality (STRONG > MODERATE > WEAK > CONTRACTING)
                        expansion: (a, b) => {
                            const qualityMap = { 'STRONG': 4, 'MODERATE': 3, 'WEAK': 2, 'CONTRACTING': 1 };
                            const aQuality = qualityMap[a.analysis?.expansion?.quality] ?? 0;
                            const bQuality = qualityMap[b.analysis?.expansion?.quality] ?? 0;
                            return aQuality - bQuality;
                        },

                        // Momentum: by alignment strength
                        momentum: (a, b) => {
                            const alignmentMap = {
                                'BULLISH_ALIGNED': 5,
                                'MOSTLY_BULLISH': 4,
                                'MIXED': 3,
                                'MOSTLY_BEARISH': 2,
                                'BEARISH_ALIGNED': 1
                            };
                            const aAlign = alignmentMap[a.analysis?.momentum?.alignment] ?? 0;
                            const bAlign = alignmentMap[b.analysis?.momentum?.alignment] ?? 0;
                            return aAlign - bAlign;
                        }
                    };

                    return comparators[columnKey] || comparators.symbol;
                },

                // ==================== UI HELPERS ====================

                formatPriceChange(price, changePercent) {
                    if (price === null || price === undefined) return '-';
                    // Price is already in thousands (e.g., 23.55 = 23,550 VND)
                    const priceFormatted = price.toFixed(2);
                    if (changePercent === null || changePercent === undefined) {
                        return `${priceFormatted}`;
                    }
                    const sign = changePercent > 0 ? '+' : '';
                    const percent = Math.abs(changePercent) < 10 ? changePercent.toFixed(1) : Math.round(changePercent);

                    return `${priceFormatted} (${sign}${percent}%)`;
                },

                getChangeClass(change) {
                    if (change === null || change === undefined) return 'change-neutral';
                    if (change > 0) return 'change-positive';
                    if (change < 0) return 'change-negative';
                    return 'change-neutral';
                },
                async loadData() {
                    this.loading = true;
                    this.errorSnackbar = false;
                    const requestedExchange = this.selectedExchange;

                    try {
                        const response = await fetch(`/api/symbols?exchange=${requestedExchange}`);
                        const result = await response.json();

                        if (result.success) {
                            // Ignore a late response from a tab the user already left.
                            if (requestedExchange !== this.selectedExchange) return false;
                            // Initialize analysis fields for each symbol to ensure reactivity
                            result.data.symbols = result.data.symbols.map(symbol => ({
                                ...symbol,
                                analyzing: false,
                                analysis: null,
                                potentialSignal: null
                            }));

                            this.matrixData = result.data;
                            console.log(`✅ Loaded ${result.data.symbols.length} symbols`);
                            return true;
                        } else {
                            throw new Error(result.error || 'Failed to load data');
                        }
                    } catch (error) {
                        console.error('❌ Error loading data:', error);
                        this.errorMessage = 'Không thể tải dữ liệu: ' + error.message;
                        this.errorSnackbar = true;
                        return false;
                    } finally {
                        this.loading = false;
                    }
                },

                // Auto-analysis methods
                async autoAnalyzeAll() {
                    if (!this.matrixData || !this.matrixData.symbols || this.matrixData.symbols.length === 0) {
                        return;
                    }

                    // Every invocation supersedes an older batch. Already
                    // analyzed objects are skipped, so a manual retry is cheap.
                    const runId = ++this.analysisRunId;
                    this.autoAnalyzing = true;

                    // Priority: VN30 first, then others
                    const vn30Symbols = this.matrixData.symbols.filter(s => s.isVN30);
                    const otherSymbols = this.matrixData.symbols.filter(s => !s.isVN30);
                    const sortedSymbols = [...vn30Symbols, ...otherSymbols];

                    this.analyzingProgress = {
                        completed: 0,
                        total: sortedSymbols.length
                    };

                    console.log(`🚀 Auto-analyzing ${sortedSymbols.length} symbols (${vn30Symbols.length} VN30 priority)...`);
                    console.log(`⏱️ Sequential mode: 2s delay between requests (~${Math.ceil(sortedSymbols.length * 2 / 60)} minutes total)`);

                    // Process sequentially with delay
                    await this.analyzeBatch(sortedSymbols, runId);

                    // A tab switch or newer manual run owns the UI now.
                    if (runId !== this.analysisRunId) return;

                    this.autoAnalyzing = false;
                    console.log(`✅ Completed auto-analysis: ${this.analyzingProgress.completed}/${this.analyzingProgress.total}`);
                },

                async analyzeBatch(symbols, runId) {
                    // Sequential processing with 1s delay to avoid rate limiting
                    for (let i = 0; i < symbols.length; i++) {
                        if (runId !== this.analysisRunId) {
                            console.log('ℹ️ Analysis batch superseded by a newer tab/run.');
                            return;
                        }
                        const item = symbols[i];

                        try {
                            await this.analyzeSymbolSilent(item);
                            this.analyzingProgress.completed++;
                        } catch (err) {
                            console.error(`❌ Error analyzing ${item.symbol}:`, err);
                            this.analyzingProgress.completed++;
                        }

                        // Add 1s delay between requests (except for the last one)
                        if (i < symbols.length - 1) {
                            await new Promise(resolve => setTimeout(resolve, 1000));
                        }
                    }
                },

                async analyzeSymbolSilent(item) {
                    if (item.analyzing || item.analysis) return; // Skip if already analyzing or analyzed

                    item.analyzing = true;

                    try {
                        const response = await fetch(`/api/analyze/${item.symbol}`);
                        const result = await response.json();

                        if (result.success) {
                            const potentialSignal = PotentialRanker.evaluatePotentialSignal(result.data);
                            Object.assign(item, {
                                ...item,
                                analysis: result.data,
                                potentialSignal,
                                analyzing: false
                            });
                            console.log(`✅ [${this.analyzingProgress.completed + 1}/${this.analyzingProgress.total}] ${item.symbol}: ${potentialSignal?.label || 'Đã phân tích'}`);
                        } else {
                            item.analyzing = false;
                            console.error(`❌ ${item.symbol}: ${result.error || 'Analysis failed'}`);
                        }
                    } catch (error) {
                        item.analyzing = false;
                    }
                }
            },
        });

        app.use(vuetify).mount('#app');
    </script>
</body>

</html>
