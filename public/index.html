<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Filter - VN30 Tracker (Matrix View)</title>
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.5.1/dist/vuetify.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
    <style>
        [v-cloak] {
            display: none;
        }

        .stock-symbol {
            font-weight: 600;
            font-size: 1.05em;
            font-family: 'Courier New', monospace;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .stock-symbol:hover {
            color: #1976D2;
        }

        .vn30-icon {
            color: #4CAF50;
            font-size: 1em;
        }

        .vn100-icon {
            color: #2196F3;
            font-size: 1em;
        }

        .hnx30-icon {
            color: #FF9800;
            font-size: 1em;
        }

        .matrix-cell {
            text-align: center;
            padding: 4px;
        }

        .status-new {
            color: #4CAF50;
            font-weight: bold;
        }

        .status-normal {
            color: #2196F3;
        }

        .status-removed {
            color: #9E9E9E;
            text-decoration: line-through;
        }

        .status-absent {
            color: #E0E0E0;
        }

        .date-header {
            font-weight: 600;
            font-size: 0.8em;
            white-space: nowrap;
            writing-mode: horizontal-tb;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-right: 16px;
            font-size: 0.9em;
        }

        .price-cell {
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            text-align: center;
        }

        .change-positive {
            color: #4CAF50;
            font-weight: 600;
        }

        .change-negative {
            color: #F44336;
            font-weight: 600;
        }

        .change-neutral {
            color: #FFA726;
            font-weight: 600;
        }

        .oracle-plan {
            min-width: 150px;
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            line-height: 1.45;
        }

        .oracle-plan .stop {
            color: #D32F2F;
        }

        .oracle-plan .target {
            color: #2E7D32;
        }

        /* HIGH Warning Pulse Animation */
        .pulse-animation {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.85;
            }
        }
    </style>
</head>

<body>
    <div id="app" v-cloak>
        <v-app>
            <v-app-bar color="primary" density="compact">
                <v-app-bar-title>
                    <v-icon icon="mdi-chart-line" class="mr-2"></v-icon>
                    Stock Filter - Matrix View
                </v-app-bar-title>
                <v-spacer></v-spacer>
                <!-- Analysis Progress -->
                <div v-if="autoAnalyzing" class="mr-4" style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 0.9em;">
                        Phân tích: {{ analyzingProgress.completed }}/{{ analyzingProgress.total }}
                    </span>
                </div>
                <v-btn icon="mdi-chart-box-outline" @click="startAnalysisRun(false)" :loading="autoAnalyzing" variant="text"
                    title="Phân tích tất cả"></v-btn>
                <v-btn icon="mdi-refresh" @click="startAnalysisRun(true)" :loading="loading" variant="text" title="Reload"></v-btn>
            </v-app-bar>

            <v-main>
                <v-container fluid>
                    <!-- Matrix Table -->
                    <v-card>
                        <!-- Exchange Filter Tabs -->
                        <v-tabs v-model="selectedExchange" density="compact" class="px-4">
                            <v-tab value="WATCHLIST">Watch List</v-tab>
                            <v-tab value="VN30">VN30</v-tab>
                            <v-tab value="HNX30">HNX30</v-tab>
                            <v-tab value="VN100">VN100</v-tab>
                            <v-tab value="POTENTIAL">POTENTIAL</v-tab>
                        </v-tabs>

                        <v-data-table :headers="matrixHeaders" :items="sortedSymbols" :items-per-page="100"
                            v-model:sort-by="sortBy" :must-sort="false" :multi-sort="false" class="elevation-1"
                            density="compact" :search="search">
                            <template v-slot:top>
                                <v-text-field v-model="search" label="Tìm kiếm mã" prepend-inner-icon="mdi-magnify"
                                    variant="outlined" hide-details single-line class="ma-4"
                                    density="compact"></v-text-field>
                                <v-alert v-if="selectedExchange === 'POTENTIAL'" type="info" variant="tonal"
                                    class="mx-4 mb-4" density="compact">
                                    <div style="font-weight: 600;">
                                        🔮 Oracle 10 phiên: {{ potentialStats.qualified }}/{{ potentialStats.analyzed }}
                                        mã có lợi thế thống kê
                                    </div>
                                    <div style="font-size: 0.82rem; margin-top: 3px;">
                                        Xác suất từ các mẫu quá khứ tương đồng; dự báo không phải cam kết lợi nhuận.
                                        Relative rank và dự báo hướng là hai kết quả độc lập.
                                    </div>
                                    <v-btn-toggle v-model="potentialView" mandatory density="compact" class="mt-2"
                                        color="primary" variant="outlined" divided>
                                        <v-btn value="TOP" size="small">Top cơ hội · P80+</v-btn>
                                        <v-btn value="WATCH" size="small">Mở rộng Watch · P65+</v-btn>
                                    </v-btn-toggle>
                                    <div v-if="oracleDirectionSummary.length" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
                                        <v-chip v-for="direction in oracleDirectionSummary" :key="direction.key"
                                            size="small" :color="direction.color" variant="tonal">
                                            {{ direction.label }}: {{ direction.count }}
                                        </v-chip>
                                    </div>
                                    <div v-if="potentialStageSummary.length" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
                                        <v-chip v-for="stage in potentialStageSummary" :key="stage.key" size="small"
                                            :color="stage.color" variant="flat">
                                            {{ stage.label }}: {{ stage.count }}
                                        </v-chip>
                                    </div>
                                </v-alert>
                            </template>

                            <template v-slot:no-data>
                                <div class="pa-8 text-center" style="color: #666;">
                                    <v-progress-circular v-if="autoAnalyzing" indeterminate size="24" color="primary" class="mr-2"></v-progress-circular>
                                    <span v-if="autoAnalyzing">
                                        Đang phân tích {{ analyzingProgress.completed }}/{{ analyzingProgress.total }} mã;
                                        cơ hội đạt điều kiện sẽ xuất hiện tại đây.
                                    </span>
                                    <span v-else-if="selectedExchange === 'POTENTIAL'">
                                        Không có mã khớp tìm kiếm/bộ lọc {{ potentialView === 'TOP' ? 'Top P80+' : 'Watch P65+' }}.
                                    </span>
                                    <span v-else>Không có dữ liệu.</span>
                                </div>
                            </template>

                            <!-- Custom Header for Price Column with Stats -->
                            <template v-slot:header.price>
                                <div style="text-align: center; line-height: 1.2;">
                                    <div v-if="priceStats.total > 0">
                                        <span style="font-weight: 600; color: #4CAF50;">{{
                                            priceStats.up }}▲</span>
                                        <span style="font-weight: 600; color: #FFA726;">{{
                                            priceStats.neutral }}−</span>
                                        <span style="font-weight: 600; color: #F44336;">{{
                                            priceStats.down }}▼</span>
                                    </div>
                                    <div style="color: #666;">({{ priceStats.total }} mã)</div>
                                </div>
                            </template>

                            <!-- Symbol Column with Analyze Button -->
                            <template v-slot:item.symbol="{ item }">
                                <a :href="item.tradingViewUrl" target="_blank" class="stock-symbol"
                                    style="text-decoration: none; color: inherit; display: flex;">
                                    {{ item.symbol }}
                                    <v-chip v-if="item.exchange" size="x-small"
                                        :color="item.exchange === 'HOSE' ? 'blue' : 'orange'" variant="flat"
                                        style="margin-left: 4px; font-size: 0.7em; height: 16px;">
                                        {{ item.exchange }}
                                    </v-chip>
                                    <v-icon v-if="item.isVN30" icon="mdi-star" class="vn30-icon" title="VN30"></v-icon>
                                    <v-icon v-if="item.isHNX30" icon="mdi-star-half-full" class="hnx30-icon" title="HNX30"></v-icon>
                                    <v-icon v-if="item.isVN100" icon="mdi-star-outline" class="vn100-icon"
                                        title="VN100"></v-icon>
                                </a>
                            </template>

                            <template v-slot:item.potential="{ item }">
                                <v-tooltip v-if="item.potentialSignal" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="item.potentialSignal.color"
                                            :prepend-icon="item.potentialSignal.icon" size="small"
                                            class="text-white font-weight-bold">
                                            {{ item.potentialSignal.badge }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.potentialSignal.tooltip"></div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <template v-slot:item.forecast="{ item }">
                                <v-tooltip v-if="getOraclePrimary(item)" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="getOracleDecisionColor(getOraclePrimary(item).decision)"
                                            size="small" class="text-white font-weight-bold">
                                            {{ getDirectionIcon(getOraclePrimary(item).direction) }}
                                            {{ getOraclePrimary(item).direction }}
                                        </v-chip>
                                    </template>
                                    <div v-html="getOracleTooltip(item)"></div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <template v-slot:item.trade_plan="{ item }">
                                <div v-if="getOraclePrimary(item)" class="oracle-plan">
                                    <v-chip size="x-small" variant="tonal" class="mb-1"
                                        :color="getOracleDecisionColor(getOraclePrimary(item).decision)">
                                        {{ getOraclePrimary(item).decision }}
                                    </v-chip>
                                    <template v-if="getOraclePrimary(item).risk_plan">
                                        <div><small>Barriers tham chiếu, không phải dự báo:</small></div>
                                        <div>Vào: {{ formatPrice(getOraclePrimary(item).risk_plan.entry.low) }}–{{ formatPrice(getOraclePrimary(item).risk_plan.entry.high) }}</div>
                                        <div class="stop">Risk: {{ formatPrice(getOraclePrimary(item).risk_plan.risk_barrier) }} (−{{ getOraclePrimary(item).risk_plan.risk_pct }}%)</div>
                                        <div class="target">Profit: {{ formatPrice(getOraclePrimary(item).risk_plan.profit_barrier) }}</div>
                                    </template>
                                </div>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <template v-slot:item.edge="{ item }">
                                <v-chip v-if="getOraclePrimary(item)" size="small"
                                    :color="getOraclePrimary(item).expected_excess_return_pct > 0 ? 'success' : 'error'" variant="tonal">
                                    {{ formatSigned(getOraclePrimary(item).expected_excess_return_pct) }}% vs TT
                                </v-chip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <template v-slot:item.confidence="{ item }">
                                <v-tooltip v-if="getOraclePrimary(item)" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" size="small" variant="outlined"
                                            :color="getOracleHealth(item)?.ranking_status === 'PASS' ? 'success' : getOracleHealth(item)?.status === 'REJECT' ? 'error' : 'warning'">
                                            {{ getOracleHealth(item)?.ranking_status || getOracleHealth(item)?.status || 'UNVALIDATED' }} · {{ getOraclePrimary(item).evidence }}
                                        </v-chip>
                                    </template>
                                    <div>{{ getOraclePrimary(item).analog_count }} analog từ {{ getOraclePrimary(item).analog_symbol_count }} mã</div>
                                    <div>Effective n: {{ getOraclePrimary(item).effective_sample_size }} · Distance: {{ getOraclePrimary(item).median_distance }}</div>
                                    <div v-for="reason in (getOracleHealth(item)?.reasons || [])" :key="reason">• {{ reason }}</div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Price Change Column -->
                            <template v-slot:item.price="{ item }">
                                <div class="price-cell" :class="getChangeClass(item.analysis?.price?.changePercent)">
                                    {{ formatPriceChange(item.analysis?.price?.current,
                                    item.analysis?.price?.changePercent) }}
                                </div>
                            </template>

                            <!-- Volume Column -->
                            <template v-slot:item.volume="{ item }">
                                <v-tooltip v-if="item.analysis?.volume_analysis" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="item.analysis.volume_analysis.color"
                                            :prepend-icon="item.analysis.volume_analysis.icon" size="small"
                                            class="text-white font-weight-bold">
                                            {{ item.analysis.volume_analysis.label }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.analysis.volume_analysis.tooltip"></div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Price vs MA Column -->
                            <template v-slot:item.price_vs_ma="{ item }">
                                <v-tooltip v-if="item.analysis?.price_position" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="item.analysis.price_position.color"
                                            :prepend-icon="item.analysis.price_position.icon" size="small"
                                            class="text-white font-weight-bold">
                                            {{ item.analysis.price_position.label }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.analysis.price_position.tooltip"></div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Convergence Column -->
                            <template v-slot:item.convergence="{ item }">
                                <v-tooltip v-if="item.analysis?.convergence" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="item.analysis.convergence.color"
                                            :prepend-icon="item.analysis.convergence.icon" size="small"
                                            class="text-white font-weight-bold">
                                            {{ item.analysis.convergence.label }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.analysis.convergence.tooltip"></div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Order & Crosses Column - 3 icons independent -->
                            <template v-slot:item.order_crosses="{ item }">
                                <div v-if="item.analysis" style="display: flex; gap: 4px; justify-content: center;">
                                    <!-- Perfect Order Icon -->
                                    <v-tooltip location="top">
                                        <template v-slot:activator="{ props }">
                                            <v-icon v-bind="props"
                                                :icon="item.analysis.perfect_order ? 'mdi-check-circle' : 'mdi-close-circle'"
                                                :color="item.analysis.perfect_order ? 'success' : 'grey'" size="small"
                                                :style="{opacity: item.analysis.perfect_order ? 1 : 0.3}">
                                            </v-icon>
                                        </template>
                                        <div v-if="item.analysis.perfect_order">✅ Perfect Order: MA10 > MA20 > MA50
                                        </div>
                                        <div v-else>❌ No Perfect Order</div>
                                    </v-tooltip>

                                    <!-- Golden Cross Icon -->
                                    <v-tooltip location="top">
                                        <template v-slot:activator="{ props }">
                                            <v-icon v-bind="props"
                                                :icon="item.analysis.golden_cross?.icon || 'mdi-star-circle'"
                                                :color="item.analysis.golden_cross?.color || 'grey'" size="small"
                                                :style="{opacity: item.analysis.golden_cross?.has_cross ? 1 : 0.3}">
                                            </v-icon>
                                        </template>
                                        <div v-html="item.analysis.golden_cross?.tooltip || 'No Golden Cross'"></div>
                                    </v-tooltip>

                                    <!-- Death Cross Icon -->
                                    <v-tooltip location="top">
                                        <template v-slot:activator="{ props }">
                                            <v-icon v-bind="props" icon="mdi-close-circle"
                                                :color="item.analysis.death_cross?.has_cross ? 'error' : 'grey'"
                                                size="small"
                                                :style="{opacity: item.analysis.death_cross?.has_cross ? 1 : 0.3}">
                                            </v-icon>
                                        </template>
                                        <div v-html="item.analysis.death_cross?.tooltip || 'No Death Cross'"></div>
                                    </v-tooltip>
                                </div>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Expansion Column -->
                            <template v-slot:item.expansion="{ item }">
                                <v-tooltip v-if="item.analysis?.expansion" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="item.analysis.expansion.color"
                                            :prepend-icon="item.analysis.expansion.icon" size="small"
                                            class="text-white font-weight-bold">
                                            {{ item.analysis.expansion.label }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.analysis.expansion.tooltip"></div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>

                            <!-- Momentum Column -->
                            <template v-slot:item.momentum="{ item }">
                                <v-tooltip v-if="item.analysis?.momentum" location="top">
                                    <template v-slot:activator="{ props }">
                                        <v-chip v-bind="props" :color="item.analysis.momentum.color"
                                            :prepend-icon="item.analysis.momentum.icon" size="small"
                                            class="text-white font-weight-bold">
                                            {{ item.analysis.momentum.label }}
                                        </v-chip>
                                    </template>
                                    <div v-html="item.analysis.momentum.tooltip"></div>
                                </v-tooltip>
                                <span v-else style="color: #999;">-</span>
                            </template>
                        </v-data-table>
                    </v-card>

                    <v-overlay :model-value="loading" class="align-center justify-center">
                        <v-progress-circular indeterminate size="64" color="primary"></v-progress-circular>
                    </v-overlay>

                    <v-snackbar v-model="errorSnackbar" color="error" timeout="5000">
                        {{ errorMessage }}
                        <template v-slot:actions>
                            <v-btn variant="text" @click="errorSnackbar = false">Đóng</v-btn>
                        </template>
                    </v-snackbar>
                </v-container>
            </v-main>
        </v-app>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.15/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.5.1/dist/vuetify.min.js"></script>
    <script>
        const { createApp } = Vue;
        const { createVuetify } = Vuetify;

        const vuetify = createVuetify({
            theme: {
                defaultTheme: 'light',
                themes: {
                    light: {
                        colors: {
                            primary: '#1976D2',
                            secondary: '#424242',
                            accent: '#82B1FF',
                            error: '#FF5252',
                            info: '#2196F3',
                            success: '#4CAF50',
                            warning: '#FFC107',
                        },
                    },
                },
            },
        });

        const app = createApp({
            data() {
                return {
                    loading: false,
                    selectedExchange: 'WATCHLIST',
                    matrixData: {
                        dates: [],
                        symbols: [],
                        stats: {}
                    },
                    search: '',
                    errorSnackbar: false,
                    errorMessage: '',
                    // Auto-analysis queue
                    analyzingQueue: [],
                    analyzingProgress: { completed: 0, total: 0 },
                    maxConcurrent: 5,
                    autoAnalyzing: false,
                    analysisRunId: 0,
                    potentialView: 'TOP',
                    // Table sorting state
                    sortBy: [] // Vuetify v-model:sort-by binding
                };
            },
            computed: {
                displayedSymbols() {
                    const symbols = this.matrixData?.symbols || [];
                    if (this.selectedExchange !== 'POTENTIAL') {
                        return symbols;
                    }

                    const decisions = this.potentialView === 'TOP'
                        ? new Set(['LONG_SETUP', 'RANK_ONLY'])
                        : new Set(['LONG_SETUP', 'RANK_ONLY', 'WATCH_LONG']);
                    const minimumRank = this.potentialView === 'TOP' ? 80 : 65;
                    return symbols.filter(symbol => {
                        const forecast = symbol.analysis?.oracle?.forecast;
                        return forecast &&
                            decisions.has(forecast.decision) &&
                            forecast.relative_rank_percentile >= minimumRank;
                    });
                },
                // Sorted symbols
                sortedSymbols() {
                    if (!this.displayedSymbols) {
                        return [];
                    }

                    const symbols = [...this.displayedSymbols];

                    // Default sort
                    if (!this.sortBy || this.sortBy.length === 0) {
                        if (this.selectedExchange === 'POTENTIAL') {
                            return this.applySortByPotential(symbols);
                        }
                        return this.applySortByPriceVsMa50(symbols);
                    }

                    // Use custom sorting based on clicked column
                    const sortConfig = this.sortBy[0]; // Vuetify returns array [{key, order}]
                    return this.applySortByColumn(symbols, sortConfig.key, sortConfig.order);
                },
                priceStats() {
                    if (!this.displayedSymbols) {
                        return { up: 0, down: 0, neutral: 0, total: 0 };
                    }

                    let up = 0, down = 0, neutral = 0;

                    this.displayedSymbols.forEach(symbol => {
                        const change = symbol.analysis?.price?.changePercent;
                        if (change !== null && change !== undefined) {
                            if (change > 0) {
                                up++;
                            } else if (change < 0) {
                                down++;
                            } else {
                                neutral++;
                            }
                        } else {
                            neutral++;
                        }
                    });

                    return {
                        up,
                        down,
                        neutral,
                        total: up + down + neutral
                    };
                },
                potentialStats() {
                    const symbols = this.matrixData?.symbols || [];
                    const analyzed = symbols.filter(symbol => !!symbol.analysis).length;
                    const qualified = this.displayedSymbols.length;

                    return {
                        analyzed,
                        qualified
                    };
                },
                potentialStageSummary() {
                    const stageMeta = [
                        { key: 'PRE-BREAKOUT', label: 'PRE-BREAKOUT', color: 'indigo' },
                        { key: 'BREAKOUT EARLY', label: 'BREAKOUT EARLY', color: 'deep-purple' },
                        { key: 'PULLBACK ENTRY', label: 'PULLBACK ENTRY', color: 'teal' },
                        { key: 'PERFECT ORDER CONTINUATION', label: 'PO CONTINUATION', color: 'green' }
                    ];

                    const counts = new Map(stageMeta.map(stage => [stage.key, 0]));

                    this.displayedSymbols.forEach(symbol => {
                        const stage = symbol.potentialSignal?.stage;
                        if (symbol.potentialSignal?.isPotential && counts.has(stage)) {
                            counts.set(stage, counts.get(stage) + 1);
                        }
                    });

                    return stageMeta
                        .map(stage => ({ ...stage, count: counts.get(stage.key) || 0 }))
                        .filter(stage => stage.count > 0);
                },
                oracleDirectionSummary() {
                    const meta = [
                        { key: 'BULLISH', label: '▲ Bullish', color: 'success' },
                        { key: 'NEUTRAL', label: '◆ Neutral', color: 'grey' },
                        { key: 'BEARISH', label: '▼ Bearish', color: 'error' }
                    ];
                    const counts = new Map(meta.map(value => [value.key, 0]));
                    this.displayedSymbols.forEach(symbol => {
                        const direction = symbol.analysis?.oracle?.forecast?.direction;
                        if (counts.has(direction)) counts.set(direction, counts.get(direction) + 1);
                    });
                    return meta.map(value => ({ ...value, count: counts.get(value.key) || 0 }))
                        .filter(value => value.count > 0);
                },
                matrixHeaders() {
                    const headers = [
                        {
                            title: 'Symbol',
                            key: 'symbol',
                            align: 'start',
                            sortable: true,
                            width: '100px'

                        },
                        {

                            key: 'price_vs_ma',

                        {

                            key: 'convergence',

                        {
                            title: 'Order & Crosses',
                            key: 'order_crosses',

                        {
                            title: 'Expansion',
                            key: 'expansion',
                            align: 'center',

                        },
                        {
                            title: 'Momentum',
                            key: 'momentum',
                            align: 'center',
                            sortable: true,
                            width: '140px'
                        },
                    ];

                    const oracleOnly = new Set(['potential', 'forecast', 'trade_plan', 'edge', 'confidence']);
                    return this.selectedExchange === 'POTENTIAL'
                        ? headers
                        : headers.filter(header => !oracleOnly.has(header.key));
                }
            },
            mounted() {
                this.startAnalysisRun(false);
            },
            watch: {
                selectedExchange() {
                    this.startAnalysisRun(false);
                }
            },
            methods: {
                /**
                 * Apply priority-based sorting (default when no column clicked)
                 */
                applySortByPriceVsMa50(symbols) {
                    return symbols.sort((a, b) => {
                        const aPriceVsMA50 = Math.abs(a.analysis?.price_position?.vs_ma50);
                        const bPriceVsMA50 = Math.abs(b.analysis?.price_position?.vs_ma50);
                        // Closer to MA50 means higher priority
                        return aPriceVsMA50 - bPriceVsMA50;
                    });
                },

                applySortByPotential(symbols) {
                    return symbols.sort((a, b) => {
                        const stageDiff = (b.potentialSignal?.stagePriority ?? -Infinity) - (a.potentialSignal?.stagePriority ?? -Infinity);
                        if (stageDiff !== 0) return stageDiff;

                        const scoreDiff = (b.potentialSignal?.score ?? -Infinity) - (a.potentialSignal?.score ?? -Infinity);
                        if (scoreDiff !== 0) return scoreDiff;

                        const entryDiff = (b.potentialSignal?.entryScore ?? -Infinity) - (a.potentialSignal?.entryScore ?? -Infinity);
                        if (entryDiff !== 0) return entryDiff;

                        const aPriceVsMA50 = Math.abs(a.analysis?.price_position?.vs_ma50 ?? Infinity);
                        const bPriceVsMA50 = Math.abs(b.analysis?.price_position?.vs_ma50 ?? Infinity);
                        return aPriceVsMA50 - bPriceVsMA50;
                    });
                },

                /**
                 * Apply column-specific sorting (when user clicks column header)
                 */
                applySortByColumn(symbols, columnKey, order = 'asc') {
                    const comparator = this.getComparatorForColumn(columnKey);
                    const sortedSymbols = symbols.sort(comparator);
                    return order === 'desc' ? sortedSymbols.reverse() : sortedSymbols;
                },

                /**
                 * Get appropriate comparator function for each column type
                 */
                getComparatorForColumn(columnKey) {
                    const comparators = {
                        // Symbol: alphabetical
                        symbol: (a, b) => (a.symbol || '').localeCompare(b.symbol || ''),

                        // Price: by current price value
                        price: (a, b) => {
                            const aPrice = a.analysis?.price?.current ?? -Infinity;
                            const bPrice = b.analysis?.price?.current ?? -Infinity;
                            return aPrice - bPrice;
                        },

                        // Volume: by volume ratio
                        volume: (a, b) => {
                            const aVolume = a.analysis?.volume_analysis?.volume_ratio ?? -Infinity;
                            const bVolume = b.analysis?.volume_analysis?.volume_ratio ?? -Infinity;
                            return aVolume - bVolume;
                        },

                        potential: (a, b) => {
                            const aStage = a.potentialSignal?.stagePriority ?? -Infinity;
                            const bStage = b.potentialSignal?.stagePriority ?? -Infinity;
                            if (aStage !== bStage) return aStage - bStage;

                            const aScore = a.potentialSignal?.score ?? -Infinity;
                            const bScore = b.potentialSignal?.score ?? -Infinity;
                            if (aScore !== bScore) return aScore - bScore;

                            const aEntry = a.potentialSignal?.entryScore ?? -Infinity;
                            const bEntry = b.potentialSignal?.entryScore ?? -Infinity;
                            return aEntry - bEntry;
                        },

                        forecast: (a, b) => {
                            const aProbability = this.getOraclePrimary(a)?.probability_up ?? -Infinity;
                            const bProbability = this.getOraclePrimary(b)?.probability_up ?? -Infinity;
                            return aProbability - bProbability;
                        },

                        edge: (a, b) => {
                            const aEdge = this.getOraclePrimary(a)?.expected_excess_return_pct ?? -Infinity;
                            const bEdge = this.getOraclePrimary(b)?.expected_excess_return_pct ?? -Infinity;
                            return aEdge - bEdge;
                        },

                        confidence: (a, b) => {
                            const rank = { A: 3, B: 2, C: 1 };
                            const aConfidence = rank[this.getOraclePrimary(a)?.evidence] || 0;
                            const bConfidence = rank[this.getOraclePrimary(b)?.evidence] || 0;
                            return aConfidence - bConfidence;
                        },

                        // Price vs MA: by distance to MA50
                        price_vs_ma: (a, b) => {
                            const aDist = a.analysis?.price_position?.vs_ma50 ?? -Infinity;
                            const bDist = b.analysis?.price_position?.vs_ma50 ?? -Infinity;
                            return aDist - bDist;
                        },

                        // Convergence: by convergence percentage
                        convergence: (a, b) => {
                            const aConv = a.analysis?.convergence?.convergence_pct ?? Infinity;
                            const bConv = b.analysis?.convergence?.convergence_pct ?? Infinity;
                            return aConv - bConv;
                        },

                        // Order & Crosses: composite score
                        order_crosses: (a, b) => {
                            const aScore = (a.analysis?.perfect_order ? 100 : 0) +
                                (a.analysis?.golden_cross?.has_cross ? 50 : 0) -
                                (a.analysis?.death_cross?.has_cross ? 100 : 0);
                            const bScore = (b.analysis?.perfect_order ? 100 : 0) +
                                (b.analysis?.golden_cross?.has_cross ? 50 : 0) -
                                (b.analysis?.death_cross?.has_cross ? 100 : 0);
                            return aScore - bScore;
                        },

                        // Expansion: by quality (STRONG > MODERATE > WEAK > CONTRACTING)
                        expansion: (a, b) => {
                            const qualityMap = { 'STRONG': 4, 'MODERATE': 3, 'WEAK': 2, 'CONTRACTING': 1 };
                            const aQuality = qualityMap[a.analysis?.expansion?.quality] ?? 0;
                            const bQuality = qualityMap[b.analysis?.expansion?.quality] ?? 0;
                            return aQuality - bQuality;
                        },

                        // Momentum: by alignment strength
                        momentum: (a, b) => {
                            const alignmentMap = {
                                'BULLISH_ALIGNED': 5,
                                'MOSTLY_BULLISH': 4,
                                'MIXED': 3,
                                'MOSTLY_BEARISH': 2,
                                'BEARISH_ALIGNED': 1
                            };
                            const aAlign = alignmentMap[a.analysis?.momentum?.alignment] ?? 0;
                            const bAlign = alignmentMap[b.analysis?.momentum?.alignment] ?? 0;
                            return aAlign - bAlign;
                        }
                    };

                    return comparators[columnKey] || comparators.symbol;
                },

                // ==================== UI HELPERS ====================

                formatPriceChange(price, changePercent) {
                    if (price === null || price === undefined) return '-';
                    // Price is already in thousands (e.g., 23.55 = 23,550 VND)
                    const priceFormatted = price.toFixed(2);
                    if (changePercent === null || changePercent === undefined) {
                        return `${priceFormatted}`;
                    }
                    const sign = changePercent > 0 ? '+' : '';
                    const percent = Math.abs(changePercent) < 10 ? changePercent.toFixed(1) : Math.round(changePercent);

                    return `${priceFormatted} (${sign}${percent}%)`;
                },

                getChangeClass(change) {
                    if (change === null || change === undefined) return 'change-neutral';
                    if (change > 0) return 'change-positive';
                    if (change < 0) return 'change-negative';
                    return 'change-neutral';
                },
                getOraclePrimary(item) {
                    const oracle = item?.analysis?.oracle;
                    if (oracle?.status !== 'READY') return null;
                    return oracle.forecast || null;
                },
                getOracleHealth(item) {
                    return item?.analysis?.oracle?.model_health || null;
                },
                getOracleDecisionColor(decision) {
                    if (decision === 'LONG_SETUP') return 'success';
                    if (['RANK_ONLY', 'WATCH_LONG'].includes(decision)) return 'warning';
                    if (decision === 'AVOID_LONG') return 'error';
                    return 'grey';
                },
                getDirectionIcon(direction) {
                    return direction === 'BULLISH' ? '▲' : direction === 'BEARISH' ? '▼' : '◆';
                },
                formatPrice(value) {
                    if (value === null || value === undefined || !Number.isFinite(Number(value))) return '-';
                    return Number(value).toLocaleString('vi-VN', { maximumFractionDigits: 2 });
                },
                formatSigned(value) {
                    const number = Number(value);
                    if (!Number.isFinite(number)) return '-';
                    return `${number > 0 ? '+' : ''}${number.toFixed(2)}`;
                },
                getOracleTooltip(item) {
                    const oracle = item?.analysis?.oracle;
                    const forecast = this.getOraclePrimary(item);
                    if (!oracle || !forecast) return '';
                    const quantiles = forecast.return_quantiles || {};
                    return [
                        `<strong>🔮 ${forecast.direction} · ${forecast.decision}</strong>`,
                        `P(Up): ${forecast.probability_up}% · P(Down): ${forecast.probability_down}%`,
                        `P(vượt thị trường): ${forecast.probability_outperform}%`,
                        `Expected return: ${this.formatSigned(forecast.expected_return_pct)}%`,
                        `Expected excess: ${this.formatSigned(forecast.expected_excess_return_pct)}%`,
                        `Dải q10/q50/q90: ${this.formatSigned(quantiles.q10)}% / ${this.formatSigned(quantiles.q50)}% / ${this.formatSigned(quantiles.q90)}%`,
                        `Relative rank: P${forecast.relative_rank_percentile} · Evidence ${forecast.evidence}`,
                        `Analogs: ${forecast.analog_count} từ ${forecast.analog_symbol_count} mã`,
                        `Ranking health: ${oracle.model_health?.ranking_status || oracle.model_health?.status || 'UNVALIDATED'}`,
                        `Direction health: ${oracle.model_health?.direction_status || 'UNVALIDATED'}`,
                        `<br><small>Dữ liệu đến ${oracle.as_of} · ${oracle.model_version}</small>`
                    ].join('<br>');
                },
                evaluatePotentialSignal(analysis) {
                    if (!analysis || analysis.error) {
                        return null;
                    }

                    const matched = [];
                    const warnings = [];
                    let structureScore = 0;
                    let entryScore = 0;

                    const priceVsMA10 = analysis.price_position?.vs_ma10 ?? -Infinity;
                    const priceVsMA20 = analysis.price_position?.vs_ma20 ?? -Infinity;
                    const priceVsMA50 = analysis.price_position?.vs_ma50 ?? -Infinity;
                    const convergenceLevel = analysis.convergence?.level;
                    const momentumAlignment = analysis.momentum?.alignment;
                    const expansionQuality = analysis.expansion?.quality;
                    const volumeTrend = analysis.volume_analysis?.trend;
                    const goldenCrosses = analysis.golden_cross?.crosses || [];
                    const deathCrosses = analysis.death_cross?.crosses || [];

                    const hasPerfectOrder = !!analysis.perfect_order;
                    const hasGoldenCross = !!analysis.golden_cross?.has_cross;
                    const hasDeathCross = !!analysis.death_cross?.has_cross;
                    const nearMA20 = priceVsMA20 >= -1.2 && priceVsMA20 <= 2.5;
                    const nearMA50 = priceVsMA50 >= -2.5 && priceVsMA50 <= 2.5;
                    const supportZone = nearMA20 || nearMA50;
                    const aboveSupport = priceVsMA20 >= -1.5 && priceVsMA50 >= -3;
                    const aboveAllThree = priceVsMA10 >= 0 && priceVsMA20 >= 0 && priceVsMA50 >= 0;
                    const nearBreakoutMA50 = priceVsMA50 >= -1.5;
                    const reclaimedMA20 = priceVsMA20 >= 0;
                    const bullishMomentum = ['BULLISH_ALIGNED', 'MOSTLY_BULLISH'].includes(momentumAlignment);
                    const nonBearishMomentum = !['MOSTLY_BEARISH', 'BEARISH_ALIGNED'].includes(momentumAlignment);
                    const tightConvergence = ['SUPER_TIGHT', 'TIGHT'].includes(convergenceLevel);
                    const goodExpansion = ['STRONG', 'MODERATE'].includes(expansionQuality);
                    const accumulationVolume = ['DECREASING', 'STABLE'].includes(volumeTrend);
                    const expandingVolume = volumeTrend === 'INCREASING';
                    const extendedAboveMA20 = priceVsMA20 > 4.5;
                    const extendedAboveMA50 = priceVsMA50 > 8;
                    const tooExtended = extendedAboveMA20 || extendedAboveMA50;
                    const underPressure = priceVsMA20 < -2.5 || priceVsMA50 < -4;
                    const freshGoldenCross = hasGoldenCross && goldenCrosses.length > 0;
                    const severeDeathCross = hasDeathCross && deathCrosses.length > 0;

                    if (hasPerfectOrder) {
                        structureScore += 3;
                        matched.push('Perfect Order');
                    }

                    if (freshGoldenCross) {
                        structureScore += 3;
                        matched.push('Golden Cross');
                    } else if (hasGoldenCross) {
                        structureScore += 2;
                        matched.push('Golden Cross');
                    }

                    if (expansionQuality === 'MODERATE') {
                        structureScore += 2;
                        matched.push('MA expansion vừa');
                    } else if (expansionQuality === 'STRONG') {
                        structureScore += 1;
                        matched.push('MA expansion mạnh');
                    }

                    if (bullishMomentum) {
                        structureScore += 2;
                        matched.push('Momentum bullish');
                    } else if (nonBearishMomentum) {
                        structureScore += 1;
                        matched.push('Momentum không bearish');
                    }

                    if (priceVsMA20 >= 0 && priceVsMA50 >= 0) {
                        entryScore += 2;
                        matched.push('Giá trên MA20 và MA50');
                    } else if (priceVsMA20 >= 0) {
                        entryScore += 1;
                        matched.push('Giá trên MA20');
                    }

                    if (nearMA20) {
                        entryScore += 3;
                        matched.push('Điểm vào gần MA20');
                    } else if (nearMA50) {
                        entryScore += 2;
                        matched.push('Điểm vào gần MA50');
                    }

                    if (convergenceLevel === 'SUPER_TIGHT') {
                        entryScore += 3;
                        matched.push('Convergence super tight');
                    } else if (convergenceLevel === 'TIGHT') {
                        entryScore += 2;
                        matched.push('Convergence tight');
                    }

                    if (accumulationVolume) {
                        entryScore += 1;
                        matched.push(volumeTrend === 'DECREASING' ? 'Volume tích luỹ' : 'Volume ổn định');
                    } else if (expandingVolume && tightConvergence && priceVsMA20 >= 0) {
                        entryScore += 1;
                        matched.push('Volume mở rộng theo breakout');
                    }

                    if (hasDeathCross) {
                        structureScore -= severeDeathCross ? 6 : 4;
                        warnings.push('Death Cross');
                    }

                    if (!nonBearishMomentum) {
                        structureScore -= 4;
                        warnings.push('Momentum bearish');
                    }

                    if (tooExtended) {
                        entryScore -= 4;
                        warnings.push('Giá đã chạy quá xa MA');
                    }

                    if (underPressure) {
                        entryScore -= 3;
                        warnings.push('Giá mất vùng hỗ trợ MA20/MA50');
                    }

                    if (priceVsMA10 < -2) {
                        entryScore -= 1;
                        warnings.push('Phản ứng ngắn hạn yếu dưới MA10');
                    }

                    const baseReady =
                        supportZone &&
                        aboveSupport &&
                        !tooExtended &&
                        !underPressure;

                    const perfectOrderContinuationReady =
                        hasPerfectOrder &&
                        goodExpansion &&
                        bullishMomentum &&
                        aboveAllThree &&
                        priceVsMA20 >= 0 &&
                        priceVsMA20 <= 3.5 &&
                        !hasDeathCross;

                    const breakoutEarlyReady =
                        aboveAllThree &&
                        reclaimedMA20 &&
                        nearBreakoutMA50 &&
                        !hasPerfectOrder &&
                        nonBearishMomentum &&
                        baseReady &&
                        (tightConvergence || freshGoldenCross || hasGoldenCross) &&
                        !hasDeathCross;

                    const preBreakoutReady =
                        tightConvergence &&
                        nonBearishMomentum &&
                        baseReady &&
                        !aboveAllThree &&
                        (priceVsMA20 >= -0.8 || priceVsMA50 >= -0.8) &&
                        !hasDeathCross;

                    const pullbackEntryReady =
                        hasPerfectOrder &&
                        bullishMomentum &&
                        baseReady &&
                        !tooExtended &&
                        (nearMA20 || nearMA50) &&
                        !hasDeathCross;

                    const stageCandidates = [
                        {
                            key: 'PERFECT ORDER CONTINUATION',
                            isMatch: perfectOrderContinuationReady
                        },
                        {
                            key: 'PULLBACK ENTRY',
                            isMatch: pullbackEntryReady
                        },
                        {
                            key: 'BREAKOUT EARLY',
                            isMatch: breakoutEarlyReady
                        },
                        {
                            key: 'PRE-BREAKOUT',
                            isMatch: preBreakoutReady
                        }
                    ];

                    const rawStage = stageCandidates.find(candidate => candidate.isMatch)?.key || null;

                    const stageValidation = {
                        'PRE-BREAKOUT': tightConvergence && !aboveAllThree && priceVsMA50 >= -1.5,
                        'BREAKOUT EARLY': aboveAllThree && reclaimedMA20 && nearBreakoutMA50,
                        'PULLBACK ENTRY': hasPerfectOrder && (nearMA20 || nearMA50) && priceVsMA50 >= -2.5,
                        'PERFECT ORDER CONTINUATION': hasPerfectOrder && aboveAllThree && priceVsMA20 >= 0
                    };

                    const stage = rawStage && stageValidation[rawStage] ? rawStage : null;

                    const stageMeta = {
                        'PRE-BREAKOUT': {
                            short: 'PB',
                            color: 'indigo',
                            icon: 'mdi-arrow-collapse-right',
                            priority: 1
                        },
                        'BREAKOUT EARLY': {
                            short: 'BE',
                            color: 'deep-purple',
                            icon: 'mdi-rocket-launch',
                            priority: 2
                        },
                        'PULLBACK ENTRY': {
                            short: 'PE',
                            color: 'teal',
                            icon: 'mdi-chart-bell-curve-cumulative',
                            priority: 3
                        },
                        'PERFECT ORDER CONTINUATION': {
                            short: 'PO',
                            color: 'green',
                            icon: 'mdi-trending-up',
                            priority: 4
                        }
                    };

                    const v2Oracle = analysis.oracle;
                    const v2Forecast = v2Oracle?.model_version?.startsWith('oracle-panel-v2')
                        ? v2Oracle.forecast
                        : null;
                    if (v2Forecast) {
                        const actionableDecisions = ['LONG_SETUP', 'RANK_ONLY', 'WATCH_LONG'];
                        const isPotential = actionableDecisions.includes(v2Forecast.decision);
                        const resolvedStage = stageMeta[v2Forecast.setup] ? v2Forecast.setup : null;
                        const directionMeta = {
                            BULLISH: { icon: 'mdi-trending-up', color: 'success', symbol: '▲' },
                            BEARISH: { icon: 'mdi-trending-down', color: 'error', symbol: '▼' },
                            NEUTRAL: { icon: 'mdi-swap-horizontal', color: 'grey', symbol: '◆' }
                        }[v2Forecast.direction] || { icon: 'mdi-help', color: 'grey', symbol: '?' };
                        const rank = v2Forecast.relative_rank_percentile;
                        const tooltip = [
                            `<strong>${directionMeta.symbol} ${v2Forecast.direction} · ${v2Forecast.decision}</strong>`,
                            `Relative rank: P${rank}`,
                            `P(Up/Down): ${v2Forecast.probability_up}% / ${v2Forecast.probability_down}%`,
                            `P(vượt thị trường): ${v2Forecast.probability_outperform}%`,
                            `Expected return: ${this.formatSigned(v2Forecast.expected_return_pct)}%`,
                            `Expected excess: ${this.formatSigned(v2Forecast.expected_excess_return_pct)}%`,
                            `Evidence: ${v2Forecast.evidence} · ${v2Forecast.analog_count} analog / ${v2Forecast.analog_symbol_count} mã`,
                            `Ranking health: ${v2Oracle.model_health?.ranking_status || v2Oracle.model_health?.status}`,
                            `Direction health: ${v2Oracle.model_health?.direction_status || 'UNVALIDATED'}`
                        ].join('<br>');
                        return {
                            isPotential,
                            score: rank,
                            structureScore,
                            entryScore,
                            stage: resolvedStage,
                            stagePriority: 0,
                            matched,
                            warnings: v2Oracle.model_health?.status === 'PASS' ? warnings : [...warnings, 'Model chưa PASS toàn phần'],
                            badge: `${directionMeta.symbol} P${rank}`,
                            label: `${v2Forecast.direction} · P${rank}`,
                            color: directionMeta.color,
                            icon: directionMeta.icon,
                            tooltip,
                            oracle: v2Forecast
                        };
                    }

                    const technicalScore = structureScore + entryScore;
                    const oracle = analysis.oracle;
                    const oraclePrimary = oracle?.status === 'READY' ? oracle.primary : null;
                    const legacyIsPotential =
                        technicalScore >= 10 &&
                        structureScore >= 4 &&
                        entryScore >= 4 &&
                        !!stage;
                    const isPotential = oraclePrimary
                        ? ['SETUP', 'WATCH'].includes(oraclePrimary.decision)
                        : legacyIsPotential;
                    const score = oraclePrimary?.opportunity_score ?? technicalScore;

                    const oracleStage = oracle?.setup && stageMeta[oracle.setup] ? oracle.setup : null;
                    const resolvedStage = isPotential ? (oracleStage || stage) : null;
                    const meta = resolvedStage ? stageMeta[resolvedStage] : null;
                    const badge = isPotential
                        ? `${meta?.short || 'OR'} · ${oraclePrimary ? `${oraclePrimary.probability_target}%` : `${score}đ`}`
                        : 'NO TRADE';
                    const label = isPotential
                        ? `${resolvedStage || 'ORACLE'} · ${oraclePrimary ? `${this.formatSigned(oraclePrimary.expected_r)}R` : `${score}đ`}`
                        : `NO TRADE · ${oraclePrimary ? `${this.formatSigned(oraclePrimary.expected_r)}R` : `${score}đ`}`;
                    const color = isPotential ? (meta?.color || 'blue') : 'grey';
                    const icon = isPotential ? (meta?.icon || 'mdi-crystal-ball') : 'mdi-filter-remove';
                    const oracleLines = oraclePrimary ? [
                        `Oracle ${oraclePrimary.horizon}D: ${oraclePrimary.probability_target}% Target / ${oraclePrimary.probability_stop}% Stop`,
                        `Expected: ${this.formatSigned(oraclePrimary.expected_r)}R · Confidence ${oraclePrimary.confidence} · n=${oraclePrimary.sample_size}`,
                        `Entry: ${this.formatPrice(oraclePrimary.entry.low)}–${this.formatPrice(oraclePrimary.entry.high)}`,
                        `Stop: ${this.formatPrice(oraclePrimary.stop)} · Target: ${this.formatPrice(oraclePrimary.target)}`
                    ] : [];
                    const tooltip = [
                        `<strong>${isPotential ? '🔮' : 'ℹ️'} ${label}</strong>`,
                        ...oracleLines,
                        `Technical structure: ${structureScore}`,
                        `Technical entry: ${entryScore}`,
                        `Technical total: ${technicalScore}`,
                        resolvedStage ? `Stage: ${resolvedStage}` : 'Stage: Chưa đủ điều kiện',
                        matched.length ? `Khớp: ${matched.join(', ')}` : 'Khớp: Chưa có tín hiệu nổi bật',
                        warnings.length ? `Rủi ro: ${warnings.join(', ')}` : 'Rủi ro kỹ thuật: Không có tín hiệu xấu nổi bật'
                    ].join('<br>');

                    return {
                        isPotential,
                        score,
                        structureScore,
                        entryScore,
                        stage: resolvedStage,
                        stagePriority: meta?.priority ?? 0,
                        matched,
                        warnings,
                        badge,
                        label,
                        color,
                        icon,
                        tooltip,
                        oracle: oraclePrimary
                    };
                },
                async startAnalysisRun(forceRefresh = false) {
                    const runId = ++this.analysisRunId;
                    // The previous loop observes the changed run id and exits at
                    // its next request/delay boundary.
                    this.autoAnalyzing = false;
                    const loaded = await this.loadData(runId);
                    if (loaded && runId === this.analysisRunId) {
                        await this.autoAnalyzeAll(runId, forceRefresh);
                    }
                },
                async loadData(runId = this.analysisRunId) {
                    this.loading = true;
                    this.errorSnackbar = false;
                    const requestedExchange = this.selectedExchange;

                    try {
                        const response = await fetch(`/api/symbols?exchange=${requestedExchange}`);
                        const result = await response.json();

                        if (runId !== this.analysisRunId || requestedExchange !== this.selectedExchange) {
                            return false;
                        }

                        if (result.success) {
                            let oracleUniverse = null;
                            if (requestedExchange === 'POTENTIAL') {
                                try {
                                    const oracleResponse = await fetch('/api/oracle/universe');
                                    const oracleResult = await oracleResponse.json();
                                    if (oracleResult.success && oracleResult.data?.status === 'READY') {
                                        oracleUniverse = oracleResult.data;
                                    }
                                } catch (oracleError) {
                                    console.warn('⚠️ Oracle snapshot unavailable; continuing with background analysis', oracleError);
                                }
                            }
                            if (runId !== this.analysisRunId) return false;
                            // Initialize analysis fields for each symbol to ensure reactivity
                            result.data.symbols = result.data.symbols.map(symbol => {
                                const forecast = oracleUniverse?.forecasts?.[symbol.symbol] || null;
                                const partialAnalysis = forecast ? {
                                    price: {
                                        current: forecast.price,
                                        changePercent: forecast.change_percent
                                    },
                                    oracle: {
                                        status: 'READY',
                                        model_version: oracleUniverse.model_version,
                                        symbol: symbol.symbol,
                                        as_of: oracleUniverse.as_of,
                                        horizon: oracleUniverse.horizon,
                                        symbol_count: oracleUniverse.symbol_count,
                                        model_health: oracleUniverse.model_health,
                                        market_state: oracleUniverse.market_state,
                                        forecast,
                                        disclaimer: oracleUniverse.disclaimer
                                    }
                                } : null;
                                return {
                                    ...symbol,
                                    analyzing: false,
                                    analysis: partialAnalysis,
                                    analysisComplete: false,
                                    analysisError: null,
                                    fetchingPrice: false,
                                    potentialSignal: partialAnalysis ? this.evaluatePotentialSignal(partialAnalysis) : null
                                };
                            });

                            this.matrixData = result.data;
                            console.log(`✅ Loaded ${result.data.symbols.length} symbols`);
                            return true;
                        } else {
                            throw new Error(result.error || 'Failed to load data');
                        }
                    } catch (error) {
                        console.error('❌ Error loading data:', error);
                        this.errorMessage = 'Không thể tải dữ liệu: ' + error.message;
                        this.errorSnackbar = true;
                        return false;
                    } finally {
                        if (runId === this.analysisRunId) this.loading = false;
                    }
                },

                // Auto-analysis methods
                async autoAnalyzeAll(runId = this.analysisRunId, forceRefresh = false) {
                    if (!this.matrixData || !this.matrixData.symbols || this.matrixData.symbols.length === 0) {
                        return;
                    }
                    if (runId !== this.analysisRunId) return;
                    this.autoAnalyzing = true;

                    // Priority: VN30 first, then others
                    const vn30Symbols = this.matrixData.symbols.filter(s => s.isVN30);
                    const otherSymbols = this.matrixData.symbols.filter(s => !s.isVN30);
                    const sortedSymbols = [...vn30Symbols, ...otherSymbols];

                    this.analyzingProgress = {
                        completed: 0,
                        total: sortedSymbols.length
                    };

                    console.log(`🚀 Auto-analyzing ${sortedSymbols.length} symbols (${vn30Symbols.length} VN30 priority)...`);
                    console.log(`⏱️ Sequential mode: 2s delay between requests (~${Math.ceil(sortedSymbols.length * 2 / 60)} minutes total)`);

                    // Process sequentially with delay
                    await this.analyzeBatch(sortedSymbols, runId, forceRefresh);

                    if (runId === this.analysisRunId) {
                        this.autoAnalyzing = false;
                        console.log(`✅ Completed auto-analysis: ${this.analyzingProgress.completed}/${this.analyzingProgress.total}`);
                    }
                },

                async analyzeBatch(symbols, runId, forceRefresh = false) {
                    // Sequential processing with 1s delay to avoid rate limiting
                    for (let i = 0; i < symbols.length; i++) {
                        if (runId !== this.analysisRunId) return;
                        const item = symbols[i];

                        try {
                            await this.analyzeSymbolSilent(item, runId, forceRefresh);
                        } catch (err) {
                            console.error(`❌ Error analyzing ${item.symbol}:`, err);
                        }
                        if (runId === this.analysisRunId) {
                            this.analyzingProgress.completed++;
                        }

                        // Add 1s delay between requests (except for the last one)
                        if (i < symbols.length - 1) {
                            await new Promise(resolve => setTimeout(resolve, 1000));
                        }
                    }
                },

                async analyzeSymbolSilent(item, runId, forceRefresh = false) {
                    if (item.analyzing || item.analysisComplete) return;

                    item.analyzing = true;
                    item.analysisError = null;

                    try {
                        const suffix = forceRefresh ? '?force=1' : '';
                        const response = await fetch(`/api/analyze/${item.symbol}${suffix}`);
                        const result = await response.json();

                        if (runId !== this.analysisRunId) return;

                        if (result.success) {
                            const potentialSignal = this.evaluatePotentialSignal(result.data);
                            Object.assign(item, {
                                ...item,
                                analysis: result.data,
                                analysisComplete: true,
                                potentialSignal,
                                analyzing: false,
                                analysisError: null
                            });
                            console.log(`✅ [${this.analyzingProgress.completed + 1}/${this.analyzingProgress.total}] ${item.symbol}: ${potentialSignal?.label || 'Đã phân tích'}`);
                        } else {
                            item.analysisError = result.error || 'Analysis failed';
                            item.analyzing = false;
                        }
                    } catch (error) {
                        item.analysisError = error.message;
                        item.analyzing = false;
                    }
                }
            },
        });

        app.use(vuetify).mount('#app');
    </script>
